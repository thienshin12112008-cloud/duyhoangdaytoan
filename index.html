<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Nhập — Duy Hoàng Dạy Toán</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="auth-page">

  <div class="auth-wrap">
    <div class="auth-left">
      <div class="brand white" style="cursor:default">📐 Duy Hoàng Dạy Toán</div>
      <h2>Chào mừng trở lại!</h2>
      <p>Nền tảng học Toán hiệu quả dành cho học sinh và giáo viên Cần Thơ.</p>
    </div>

    <div class="auth-right">
      <div class="auth-box">
        <h2>Đăng nhập</h2>

        <div class="tab-row">
          <button class="tab-btn active" id="tabStudent">Học Sinh</button>
          <button class="tab-btn" id="tabTeacher">Giáo Viên</button>
          <button class="tab-btn" id="tabAssistant">Trợ Lý</button>
        </div>

        <form id="loginForm">
          <label id="usernameLabel">Gmail</label>
          <div class="input-icon">
            <span>📧</span>
            <input type="text" id="usernameInput" placeholder="Nhập Gmail của bạn" required/>
          </div>
          <label id="passwordLabel">Số báo danh</label>
          <div class="input-icon">
            <span>🔒</span>
            <input type="password" id="passwordInput" placeholder="Nhập số báo danh" required/>
          </div>
          <div class="auth-row">
            <label class="checkbox-label"><input type="checkbox"/> Ghi nhớ đăng nhập</label>
            <a href="#" class="link-muted">Quên mật khẩu?</a>
          </div>
          <div id="loginError" class="error-msg"></div>
          <button type="submit" class="btn-primary btn-block">Đăng Nhập</button>
        </form>

        <p class="auth-hint">Chưa có tài khoản? Liên hệ trợ lý Trần Cường.</p>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('dh_teacher')) {
      localStorage.setItem('dh_teacher', JSON.stringify({ username: 'duyhoangtoan', password: 'admin123', full_name: 'Thầy Duy Hoàng' }));
    }
    if (!localStorage.getItem('dh_students')) localStorage.setItem('dh_students', JSON.stringify([]));
    if (!localStorage.getItem('dh_videos'))   localStorage.setItem('dh_videos', JSON.stringify([]));
    if (!localStorage.getItem('dh_exams'))    localStorage.setItem('dh_exams', JSON.stringify([]));
    if (!localStorage.getItem('dh_subjects')) {
      localStorage.setItem('dh_subjects', JSON.stringify([
        { id: 1, name: 'Đại Số' }, { id: 2, name: 'Hình Học' },
        { id: 3, name: 'Giải Tích' }, { id: 4, name: 'Lượng Giác' }, { id: 5, name: 'Ôn Thi' }
      ]));
    }

    // Seed tài khoản trợ lý mặc định
    if (!localStorage.getItem('dh_assistants')) {
      localStorage.setItem('dh_assistants', JSON.stringify([
        { username: 'trolytoan', password: 'tro123', full_name: 'Trợ Lý' }
      ]));
    }

    let role = 'student';
    function setLabels() {
      document.getElementById('usernameLabel').textContent  = role === 'student' ? 'Gmail' : 'Tên đăng nhập';
      document.getElementById('passwordLabel').textContent  = role === 'student' ? 'Số báo danh' : 'Mật khẩu';
      document.getElementById('usernameInput').placeholder  = role === 'student' ? 'Nhập Gmail của bạn' : 'Nhập tên đăng nhập';
      document.getElementById('passwordInput').placeholder  = role === 'student' ? 'Nhập số báo danh' : 'Nhập mật khẩu';
    }

    function setTab(r) {
      role = r;
      ['tabStudent','tabTeacher','tabAssistant'].forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById(r === 'student' ? 'tabStudent' : r === 'teacher' ? 'tabTeacher' : 'tabAssistant').classList.add('active');
      setLabels();
    }

    document.getElementById('tabStudent').onclick   = () => setTab('student');
    document.getElementById('tabTeacher').onclick   = () => setTab('teacher');
    document.getElementById('tabAssistant').onclick = () => setTab('assistant');

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('usernameInput').value.trim();
      const p = document.getElementById('passwordInput').value;
      const err = document.getElementById('loginError');
      err.textContent = '';

      if (role === 'teacher') {
        const t = JSON.parse(localStorage.getItem('dh_teacher'));
        if (u === t.username && p === t.password) {
          sessionStorage.setItem('dh_role', 'teacher');
          sessionStorage.setItem('dh_user', u);
          sessionStorage.setItem('dh_name', t.full_name);
          window.location.href = 'admin.html';
        } else { err.textContent = 'Sai tên đăng nhập hoặc mật khẩu.'; }

      } else if (role === 'assistant') {
        const list = JSON.parse(localStorage.getItem('dh_assistants') || '[]');
        const a = list.find(x => x.username === u && x.password === p);
        if (a) {
          sessionStorage.setItem('dh_role', 'assistant');
          sessionStorage.setItem('dh_user', u);
          sessionStorage.setItem('dh_name', a.full_name);
          window.location.href = 'assistant.html';
        } else { err.textContent = 'Sai tên đăng nhập hoặc mật khẩu.'; }

      } else {
        const list = JSON.parse(localStorage.getItem('dh_students'));
        const s = list.find(x => x.username === u && x.password === p);
        if (!s) { err.textContent = 'Sai tên đăng nhập hoặc mật khẩu.'; return; }
        if (!s.active) { err.textContent = 'Tài khoản đã bị khóa.'; return; }
        sessionStorage.setItem('dh_role', 'student');
        sessionStorage.setItem('dh_user', u);
        sessionStorage.setItem('dh_name', s.full_name);
        window.location.href = 'student.html';
      }
    });
  </script>
</body>
</html>
